name: Backend validation
on:
  pull_request:
  push:
    branches: [production-hardening]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ runner.temp }}/kurtex-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q api backend bot_app scripts
      - run: python -m unittest discover -s tests -p test_production_hardening.py -v
